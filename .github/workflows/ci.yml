name: Data Mining CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy beautifulsoup4 matplotlib
      - name: Run Bilingual Unit Tests (Persian & English)
        run: |
          python -m unittest discover -s tests -v
      - name: Run Default Persian & English Football News Comparisons
        run: |
          python persian_news_similarity_miner.py --preset irna_vs_mehr --json-out default_comparison_result.json
          python persian_news_similarity_miner.py --preset english_guardian_vs_reuters --json-out english_comparison_result.json
